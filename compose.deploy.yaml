services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: orders
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'app', '-d', 'orders']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ghcr.io/arturpawelski/node-devops-lab:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/orders
    command: ['npm', 'run', 'migrate', '--', 'up']
    depends_on:
      db:
        condition: service_healthy
    profiles: ['tools']

  api:
    image: ghcr.io/arturpawelski/node-devops-lab:${IMAGE_TAG:?Set IMAGE_TAG}
    ports:
      - '127.0.0.1:3003:3000'
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/orders
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
