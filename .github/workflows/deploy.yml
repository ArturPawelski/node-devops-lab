name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA of the published image
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Validate image tag and script
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Provide a full commit SHA"
            exit 1
          fi
          bash -n scripts/deploy.sh

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy on VM
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          {
            echo "set -eu"

            echo "cat > /home/azureuser/node-devops-lab/compose.deploy.yaml <<'COMPOSE_CONFIG'"
            cat compose.deploy.yaml
            printf '\nCOMPOSE_CONFIG\n'

            echo "bash -s -- '$IMAGE_TAG' <<'DEPLOY_SCRIPT'"
            cat scripts/deploy.sh
            printf '\nDEPLOY_SCRIPT\n'
          } > run-deploy.sh

          az vm run-command invoke \
            --resource-group rg-node-devops-lab \
            --name vm-node-devops-lab \
            --command-id RunShellScript \
            --scripts @run-deploy.sh \
            --output json > deploy-result.json

          jq -r '.value[]?.message // empty' deploy-result.json \
            | tee deploy-output.log

          if ! grep -Fxq 'DEPLOY_OK' deploy-output.log; then
            echo "Deployment did not report success"
            exit 1
          fi
