name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - run: npm run build

      - name: Build Docker image
        run: docker build -t node-devops-lab:ci .

      - name: Start database
        run: docker compose -p orders-smoke up -d --wait db

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/orders
        run: npm run migrate -- up

      - name: Seed test database
        run: |
          docker compose -p orders-smoke exec -T db \
            psql -v ON_ERROR_STOP=1 -U app -d orders < db/seed.sql

      - name: Start API
        run: docker compose -p orders-smoke up --build -d api

      - name: Check API readiness
        run: |
          curl --fail --show-error --silent \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --max-time 5 \
            http://localhost:3002/health

      - name: Check orders endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --max-time 5 \
            --output orders-response.json \
            http://localhost:3002/orders

          node scripts/assert-orders-response.mjs

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -p orders-smoke ps -a
          docker compose -p orders-smoke logs --no-color

      - name: Clean up containers
        if: always()
        run: docker compose -p orders-smoke down -v

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build and publish versioned image
        env:
          IMAGE: ghcr.io/arturpawelski/node-devops-lab
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
