name: CI

on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run build

      - name: Build Docker image
        run: docker build -t node-devops-lab:ci .

      - name: Start API and database
        run: docker compose -p orders-smoke up --build -d

      - name: Check API readiness
        run: |
          curl --fail --show-error --silent \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --max-time 5 \
            http://localhost:3002/health

      - name: Check orders endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --max-time 5 \
            --output orders-response.json \
            http://localhost:3002/orders

          node scripts/assert-orders-response.mjs

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -p orders-smoke logs --no-color
          docker compose -p orders-smoke ps -a

      - name: Clean up containers
        if: always()
        run: docker compose -p orders-smoke down -v
