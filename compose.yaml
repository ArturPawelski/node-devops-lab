services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/orders
    depends_on:
      - db

volumes:
  postgres_data: