services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'app', '-d', 'orders']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build: .
    ports:
      - '3002:3000'
    environment:
      DATABASE_URL: postgres://app:app@db:5432/orders
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
